name: Supabase Migrate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which Supabase project to push migrations to"
        required: true
        type: choice
        options:
          - production
          - dev

jobs:
  migrate:
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-migrate-${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Link and push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ inputs.environment == 'production' && secrets.SUPABASE_PROD_DB_PASSWORD || secrets.SUPABASE_DEV_DB_PASSWORD }}
          PROJECT_REF: ${{ inputs.environment == 'production' && secrets.SUPABASE_PROD_PROJECT_REF || secrets.SUPABASE_DEV_PROJECT_REF }}
        run: |
          if [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Missing secrets for environment '${{ inputs.environment }}'"
            exit 1
          fi
          echo "Target: ${{ inputs.environment }} (ref ${PROJECT_REF:0:4}...)"
          supabase link --project-ref "$PROJECT_REF"
          supabase db push
