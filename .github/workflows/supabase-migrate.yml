name: Supabase Migrate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which Supabase project to push migrations to"
        required: true
        type: choice
        options:
          - production
          - dev

jobs:
  migrate:
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-migrate-${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Link and push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ inputs.environment == 'production' && secrets.SUPABASE_PROD_DB_PASSWORD || secrets.SUPABASE_DEV_DB_PASSWORD }}
          PROJECT_REF: ${{ inputs.environment == 'production' && secrets.SUPABASE_PROD_PROJECT_REF || secrets.SUPABASE_DEV_PROJECT_REF }}
          DB_URL: ${{ inputs.environment == 'production' && secrets.SUPABASE_PROD_DB_URL || secrets.SUPABASE_DEV_DB_URL }}
          PROD_PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
          PROD_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
          PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
          DEV_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
          DEV_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
          DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            if [ -z "$PROD_PROJECT_REF" ] || [ -z "$PROD_DB_PASSWORD" ] || [ -z "$PROD_DB_URL" ]; then
              echo "::error::Missing SUPABASE_PROD_PROJECT_REF, SUPABASE_PROD_DB_PASSWORD, or SUPABASE_PROD_DB_URL secret"
              exit 1
            fi
          else
            if [ -z "$DEV_PROJECT_REF" ] || [ -z "$DEV_DB_PASSWORD" ] || [ -z "$DEV_DB_URL" ]; then
              echo "::error::Missing SUPABASE_DEV_PROJECT_REF, SUPABASE_DEV_DB_PASSWORD, or SUPABASE_DEV_DB_URL secret"
              exit 1
            fi
          fi
          echo "Target: ${{ inputs.environment }} (ref ${PROJECT_REF:0:4}...)"
          supabase link --project-ref "$PROJECT_REF"
          supabase db push --db-url "$DB_URL"
